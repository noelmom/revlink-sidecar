name: CI

# GitHub-hosted runners are free and unlimited for PUBLIC repositories, but
# bill against a monthly minute allowance while a repository is private. This
# repository is private for now, so automatic runs are switched off and
# `scripts/ci-local.sh` is the checked-in equivalent that maintainers run.
#
# When this repository goes public, restore automatic CI by replacing the
# `on:` block below with:
#
#   on:
#     push:
#       branches: [main]
#     pull_request:
#
# Until then it can still be started by hand from the Actions tab.
on:
  workflow_dispatch:

jobs:
  host-tests:
    name: Host tests (C)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Configure
        run: cmake -S firmware/test -B build/host -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        run: cmake --build build/host --parallel

      - name: Test
        run: ctest --test-dir build/host --output-on-failure

  portal-tests:
    name: Portal tests (Node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Run portal tests
        run: |
          status=0
          for f in firmware/test/portal_*.mjs; do
            echo "==> $f"
            node "$f" || status=1
          done
          exit $status

  enclosure-geometry:
    name: Enclosure geometry baseline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Report STL topology
        working-directory: hardware/nano-enclosure
        run: |
          python3 tools/stl_inspect.py \
            enclosure-print/source/esp32-p4-nano-bottom.stl \
            enclosure-print/source/esp32-p4-nano-top-solid.stl \
            enclosure-print/print-package/01-revlink-sidecar-nano-bottom.stl \
            enclosure-print/print-package/02-revlink-sidecar-nano-top-oled-usbc-controls.stl \
            enclosure-print/print-package/03-revlink-sidecar-nano-usbc-side-buttons-pair.stl
