name: Deploy site

# Publishes the landing page (web/site) at / and the flasher (web/flash) at
# /flash/. Pages can only serve a repository root or /docs when deploying from
# a branch, so the assembled site is uploaded as an artifact instead.
on:
  push:
    branches: [main]
    paths:
      # web/site was missing here while the job below happily copied it into
      # the artifact, so a landing-page-only change assembled correctly and
      # then never deployed. A wrong claim about the firmware sat on the live
      # page after the commit that fixed it, with a green tick next to it.
      - "web/site/**"
      - "web/flash/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deployments race; let an in-flight one finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      # The page verifies every binary against manifest.json before writing to
      # a board. Verify the same thing here so a bad artifact is never
      # published in the first place.
      - name: Verify release manifest and flasher gate
        run: node --test web/flash/gate.test.mjs

      - uses: actions/configure-pages@v5

      # Assemble the site: landing page at /, flasher at /flash/.
      - name: Assemble site
        run: |
          mkdir -p _site
          cp -r web/site/. _site/
          mkdir -p _site/flash
          cp -r web/flash/. _site/flash/
          rm -f _site/flash/README.md _site/flash/gate.test.mjs
          # CNAME rides along from web/site and is what binds the custom
          # domain to this artifact. Fail loudly if it ever goes missing:
          # without it GitHub serves the site at the github.io path and the
          # custom domain 404s, which looks like a DNS problem and is not.
          test -f _site/CNAME || { echo "CNAME missing from the artifact"; exit 1; }
          echo "custom domain: $(cat _site/CNAME)"
          find _site -type f | sort

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
